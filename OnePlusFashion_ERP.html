<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Plus Fashion ERP</title>
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <!-- Hosted site: show the short address (.../oneplus_fashion_erp/#/page) instead of the file name.
       That address opens index.html, which forwards here, so reload, bookmarks and shared links work.
       The file itself keeps its name: Firefox stores the saved data of a double-clicked ERP per file. -->
  <script>
    if (/^https?:$/.test(location.protocol) && /\/OnePlusFashion_ERP\.html$/.test(location.pathname)) {
      history.replaceState(null, "", location.pathname.replace(/OnePlusFashion_ERP\.html$/, "") + location.search + location.hash);
    }
  </script>
  <link rel="stylesheet" href="assets/css/app.css">
  <!-- Cash memo / receipt styles, switched on only while a phone prints (js/services/print.js). -->
  <link rel="stylesheet" href="assets/css/print.css" id="printCss" media="not all">
</head>

<body>
  <nav class="side" id="nav"></nav>
  <div class="scrim" data-act="shell.closeMenu"></div>
  <header class="top">
    <button class="iconbtn" data-act="shell.menu" title="Menu"><span data-icon="menu"></span></button>
    <div class="crumb" id="pageTitle"></div>
    <div class="spacer"></div>
    <div class="gsearch">
      <span data-icon="search"></span>
      <input id="gsearch" placeholder="Search customer by name or mobile..." autocomplete="off">
      <div id="gresults"></div>
    </div>
    <div class="theme-switch" title="Theme">
      <button data-act="shell.theme" data-theme-set="light" title="Light"><span data-icon="sun"></span></button>
      <button data-act="shell.theme" data-theme-set="dark" title="Dark"><span data-icon="moon"></span></button>
    </div>
    <div class="lang-switch" title="Language" data-no-i18n>
      <button data-act="shell.lang" data-lang="en" title="English">EN</button>
      <button data-act="shell.lang" data-lang="bn" title="বাংলা">বাং</button>
    </div>
    <span class="chip hide-sm"><span data-icon="clock"></span><span id="clock"></span></span>
    <button id="syncBadge" class="chip sync" data-act="cloud.badge" hidden></button>
    <button id="lockBtn" class="light" data-act="auth.toggle">Admin: Locked</button>
    <a class="btn good addsale" href="#/sales"><span data-icon="cart"></span><span class="lb">Sale</span></a>
    <button class="light backup" data-act="backup.excel" title="Download full Excel backup"><span data-icon="download"></span>Backup</button>
  </header>
  <div class="shell">
    <main class="main" id="app"></main>
  </div>
  <div id="modal"></div>

  <!-- Plain scripts (not ES modules): modules are blocked for pages opened from file://.
       Order matters - each layer only uses the layers above it. See docs/ARCHITECTURE.md. -->
  <script src="js/boot-check.js"></script>

  <!-- core: config, helpers, storage -->
  <script src="js/core/config.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/sha256.js"></script>
  <script src="js/core/migrate.js"></script>
  <script src="js/core/store.js"></script>

  <!-- domain: business rules (no DOM) -->
  <script src="js/domain/calc.js"></script>
  <script src="js/domain/ledger.js"></script>
  <script src="js/domain/stock.js"></script>
  <script src="js/domain/audit.js"></script>

  <!-- ui framework -->
  <script src="js/ui/actions.js"></script>
  <script src="js/ui/i18n.js"></script>
  <script src="js/ui/lang-bn.js"></script>
  <script src="js/ui/icons.js"></script>
  <script src="js/ui/html.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/router.js"></script>
  <script src="js/ui/shell.js"></script>
  <script src="js/ui/lists.js"></script>
  <script src="js/ui/forms.js"></script>
  <script src="js/ui/records.js"></script>
  <script src="js/ui/search.js"></script>
  <script src="js/ui/charts.js"></script>
  <script src="js/ui/richtext.js"></script>
  <script src="js/ui/sketch.js"></script>

  <!-- services: auth, printing, export -->
  <script src="js/services/auth.js"></script>
  <script src="js/services/print.js"></script>
  <script src="js/services/xlsx.js"></script>
  <script src="js/services/sheets.js"></script>
  <script src="js/services/backup.js"></script>
  <script src="js/services/drive.js"></script>
  <script src="js/services/cloud.js"></script>

  <!-- pages (sidebar order) -->
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/suppliers.js"></script>
  <script src="js/pages/purchase.js"></script>
  <script src="js/pages/materials.js"></script>
  <script src="js/pages/productionOrder.js"></script>
  <script src="js/pages/issue.js"></script>
  <script src="js/pages/production.js"></script>
  <script src="js/pages/factories.js"></script>
  <script src="js/pages/products.js"></script>
  <script src="js/pages/transfer.js"></script>
  <script src="js/pages/showroom.js"></script>
  <script src="js/pages/customers.js"></script>
  <script src="js/pages/partyViews.js"></script>
  <script src="js/pages/sales.js"></script>
  <script src="js/pages/returns.js"></script>
  <script src="js/pages/payments.js"></script>
  <script src="js/pages/expenses.js"></script>
  <script src="js/pages/courier.js"></script>
  <script src="js/pages/notes.js"></script>
  <script src="js/pages/costing.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/ledger.js"></script>
  <script src="js/pages/users.js"></script>
  <script src="js/pages/settings.js"></script>

  <script src="js/app.js"></script>
</body>

</html>
