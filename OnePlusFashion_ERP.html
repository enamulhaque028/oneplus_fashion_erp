<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Plus Fashion ERP</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>

<body>
  <header class="top">
    <img class="logo" src="assets/img/intus_algorithm_logo.png" alt="Intu's Algorithm">
    <div class="gsearch">
      <input id="gsearch" placeholder="Search customer by name or mobile number..." autocomplete="off">
      <div id="gresults"></div>
    </div>
    <div class="right">
      <span id="clock"></span>
      <button id="lockBtn" class="light" data-act="auth.toggle">Admin: Locked</button>
      <button class="light" data-act="backup.excel">Backup</button>
    </div>
  </header>
  <div class="shell">
    <nav class="side" id="nav"></nav>
    <main class="main" id="app"></main>
  </div>
  <div id="modal"></div>

  <!-- Plain scripts (not ES modules): modules are blocked for pages opened from file://.
       Order matters - each layer only uses the layers above it. See docs/ARCHITECTURE.md. -->
  <script src="js/boot-check.js"></script>

  <!-- core: config, helpers, storage -->
  <script src="js/core/config.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/sha256.js"></script>
  <script src="js/core/migrate.js"></script>
  <script src="js/core/store.js"></script>

  <!-- domain: business rules (no DOM) -->
  <script src="js/domain/calc.js"></script>
  <script src="js/domain/ledger.js"></script>
  <script src="js/domain/stock.js"></script>
  <script src="js/domain/audit.js"></script>

  <!-- ui framework -->
  <script src="js/ui/actions.js"></script>
  <script src="js/ui/html.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/router.js"></script>
  <script src="js/ui/lists.js"></script>
  <script src="js/ui/forms.js"></script>
  <script src="js/ui/records.js"></script>
  <script src="js/ui/search.js"></script>

  <!-- services: auth, printing, export -->
  <script src="js/services/auth.js"></script>
  <script src="js/services/print.js"></script>
  <script src="js/services/xlsx.js"></script>
  <script src="js/services/sheets.js"></script>
  <script src="js/services/backup.js"></script>

  <!-- pages (sidebar order) -->
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/suppliers.js"></script>
  <script src="js/pages/purchase.js"></script>
  <script src="js/pages/materials.js"></script>
  <script src="js/pages/productionOrder.js"></script>
  <script src="js/pages/issue.js"></script>
  <script src="js/pages/production.js"></script>
  <script src="js/pages/factories.js"></script>
  <script src="js/pages/products.js"></script>
  <script src="js/pages/transfer.js"></script>
  <script src="js/pages/showroom.js"></script>
  <script src="js/pages/customers.js"></script>
  <script src="js/pages/partyViews.js"></script>
  <script src="js/pages/sales.js"></script>
  <script src="js/pages/returns.js"></script>
  <script src="js/pages/payments.js"></script>
  <script src="js/pages/expenses.js"></script>
  <script src="js/pages/courier.js"></script>
  <script src="js/pages/costing.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/ledger.js"></script>
  <script src="js/pages/users.js"></script>
  <script src="js/pages/settings.js"></script>

  <script src="js/app.js"></script>
</body>

</html>
