<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Plus Fashion ERP</title>
<style>
body{margin:0;font:14px Arial,sans-serif;background:#eef2f6;color:#1e293b}
*{box-sizing:border-box}.top{height:64px;background:#17233a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;position:sticky;top:0;z-index:10}
.logo{height:46px;background:#fff;border-radius:5px;padding:2px;max-width:210px}.top .right{display:flex;align-items:center;gap:8px}
.shell{display:flex;min-height:calc(100vh - 64px)}.side{width:215px;background:#fff;border-right:1px solid #d9e0e8;padding:10px;position:fixed;top:64px;bottom:0;overflow:auto}.side button{width:100%;padding:9px;border:0;border-radius:6px;background:#fff;text-align:left;margin:2px 0;color:#25344b;cursor:pointer}.side button:hover,.side button.on{background:#e9eff6;font-weight:bold}
.main{margin-left:215px;width:calc(100% - 215px);padding:18px;max-width:1500px}h1{margin:0 0 14px;font-size:24px}h2{font-size:17px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card{background:#fff;border:1px solid #dbe2ea;border-radius:8px;padding:13px}.card .big{font-size:21px;font-weight:bold;margin-top:5px}.muted{color:#64748b;font-size:12px}
.box{background:#fff;border:1px solid #dbe2ea;border-radius:8px;padding:14px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field label{display:block;font-size:12px;color:#5b6878;margin-bottom:3px}.field input,.field select,.field textarea{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:5px;background:#fff}.field textarea{min-height:70px}
button,.btn{border:0;border-radius:5px;padding:8px 12px;background:#17233a;color:#fff;cursor:pointer}.light{background:#e9eef5;color:#17233a}.good{background:#28734a}.warn{background:#9a6900}.bad{background:#a23a3a}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.table{overflow:auto;background:#fff;border:1px solid #dbe2ea;border-radius:7px}.table table{border-collapse:collapse;width:100%;min-width:850px}.table th,.table td{padding:7px;border-bottom:1px solid #e5eaf0;text-align:left;font-size:12px}.table th{background:#edf1f5}.pill{padding:3px 7px;border-radius:10px;background:#e7edf3}
.alert{padding:10px;border-radius:6px;background:#fff6dc;border:1px solid #e6cf84;margin:10px 0}.search{display:flex;gap:8px;margin:10px 0}.search input{flex:1;padding:9px;border:1px solid #cbd5e1;border-radius:5px}
@media(max-width:1050px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.side{position:static;width:100%;display:flex;flex-wrap:wrap}.side button{width:auto;flex:1 1 45%}.shell{display:block}.main{margin-left:0;width:100%}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{position:static}}
@media print{.side,.top{display:none}.main{margin:0;width:100%;padding:0}.no-print{display:none}}
</style>
</head>

<div class="shell"><nav class="side" id="nav"></nav><main class="main" id="app"></main></div>
<script>
var KEY="opf_erp_smart_v3";
var db=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"null")||fresh()}catch(e){return fresh()}}
function fresh(){return {company:{name:"One Plus Fashion",phone:"01814109285",address:""},suppliers:[],materials:[],purchases:[],issues:[],products:[],productionOrders:[],production:[],factories:[],transfers:[],customers:[],sales:[],returns:[],payments:[],expenses:[],courier:[],showrooms:[{id:"main",name:"Owner Permanent Shop"}],logs:[],users:[{id:"u1",name:"Administrator",username:"admin",role:"Admin"}]}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function num(v){return parseFloat(v)||0}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function money(v){return num(v).toLocaleString("en-BD",{minimumFractionDigits:2,maximumFractionDigits:2})}
function today(){return new Date().toISOString().slice(0,10)}
function log(action,ref){db.logs.push({date:new Date().toISOString(),action:action,ref:ref||""});save()}
var menus=[["dashboard","Dashboard"],["suppliers","Suppliers"],["purchase","Fabric / Raw Purchase"],["materials","Raw Material Stock"],["productionOrder","Production Order"],["issue","Material Issue"],["production","Production / Finished"],["factories","Factory / Worker"],["products","Style / Product"],["transfer","Factory → Shop"],["showroom","Showroom Stock"],["customers","Customers"],["sales","Sales / Invoice"],["returns","Sales Return"],["payments","Payment / Collection"],["expenses","Expenses"],["courier","Courier / Delivery"],["costing","Product Costing"],["reports","Reports"],["ledger","Ledgers / Due"],["users","Users / Activity"],["settings","Settings / Backup"]];
function nav(active){document.getElementById("nav").innerHTML=menus.map(function(m){return '<button class="'+(active==m[0]?"on":"")+'" onclick="go(\''+m[0]+'\')">'+m[1]+'</button>'}).join("")}
function go(p){nav(p);window.scrollTo(0,0);var f=window[p];if(typeof f=="function")f();else dashboard()}
function field(n,l,t,v,req){return '<div class="field"><label>'+l+'</label><input name="'+n+'" type="'+(t||"text")+'" value="'+esc(v||"")+'" '+(req?"required":"")+'></div>'}
function select(n,l,opts,req){return '<div class="field"><label>'+l+'</label><select name="'+n+'" '+(req?"required":"")+'>'+opts+'</select></div>'}
function options(arr,valField,textField){return arr.map(function(x){return '<option value="'+esc(x[valField])+'">'+esc(x[textField])+'</option>'}).join("")}
function form(title,action,fields){document.getElementById("app").innerHTML='<h1>'+title+'</h1><form class="box" onsubmit="'+action+'(this);return false"><div class="grid">'+fields.join("")+'</div><div class="actions"><button>Save</button><button type="button" class="light" onclick="this.form.reset()">Clear</button></div></form>'}
function table(head,rows){return '<div class="table"><table><thead><tr>'+head.map(function(h){return "<th>"+h+"</th>"}).join("")+'</tr></thead><tbody>'+(rows.length?rows.join(""):'<tr><td colspan="'+head.length+'" class="muted">No records found</td></tr>')+'</tbody></table></div>'}
function sum(a,fn){return a.reduce(function(t,x){return t+fn(x)},0)}
function purchaseTotal(r){return num(r.qty)*num(r.rate)+num(r.transport)+num(r.loading)+num(r.other)}
function saleTotal(r){return num(r.qty)*num(r.rate)-num(r.discount)}
function dashboard(){
var sales=sum(db.sales,saleTotal),coll=sum(db.payments,function(x){return x.type=="Customer"?num(x.amount):0})+sum(db.sales,function(x){return num(x.paid)}),pur=sum(db.purchases,purchaseTotal),exp=sum(db.expenses,function(x){return num(x.amount)}),prod=sum(db.production,function(x){return num(x.accepted)}),due=sales-coll;
document.getElementById("app").innerHTML='<h1>Dashboard</h1><div class="cards"><div class="card">Today Sales<div class="big">'+money(sum(db.sales.filter(function(x){return x.date==today()}),saleTotal))+'</div></div><div class="card">Today Collection<div class="big">'+money(sum(db.payments.filter(function(x){return x.date==today()}),function(x){return num(x.amount)}))+'</div></div><div class="card">Customer Due<div class="big">'+money(due)+'</div></div><div class="card">Purchases<div class="big">'+money(pur)+'</div></div><div class="card">Finished PCS<div class="big">'+prod.toLocaleString()+'</div></div><div class="card">Expense<div class="big">'+money(exp)+'</div></div></div><div class="box"><h2>End-to-End Workflow</h2><div class="muted">Supplier → Purchase → Raw Stock → Material Issue → Production → Finished Goods → Factory/Shop Transfer → Showroom → Sales → Customer Ledger → Payment → Courier → Invoice → P/L</div><div class="actions"><button onclick="go(\'purchase\')">+ Purchase</button><button onclick="go(\'issue\')">+ Material Issue</button><button onclick="go(\'production\')">+ Production</button><button onclick="go(\'sales\')">+ Sale</button><button onclick="go(\'payments\')">+ Collection</button><button onclick="go(\'courier\')">+ Courier</button></div></div><div class="alert">This edition is optimized for your Windows 7 / 4 GB RAM laptop. It is offline and requires no Python, MySQL, Node.js or VPS for single-computer use.</div>'
}
function suppliers(){form("Supplier / Fabric Party","addSupplier",[field("name","Party Name","text","","1"),field("company","Company"),field("mobile","Mobile"),field("address","Address / District"),field("credit","Credit Limit","number","0"),field("terms","Payment Terms"),field("previousDue","Previous Due","number","0")]);var rows=db.suppliers.map(function(r){return '<tr><td>'+esc(r.name)+'</td><td>'+esc(r.company)+'</td><td>'+esc(r.mobile)+'</td><td>'+esc(r.address)+'</td><td>'+money(r.previousDue)+'</td></tr>'});document.getElementById("app").insertAdjacentHTML("beforeend",'<h2>Supplier Register</h2>'+table(["Party","Company","Mobile","Address","Previous Due"],rows))}
function addSupplier(f){var d=Object.fromEntries(new FormData(f));d.id=uid();d.previousDue=num(d.previousDue);db.suppliers.push(d);log("Supplier Created",d.name);suppliers()}
function purchase(){var opts='<option value="">Select</option>'+options(db.suppliers,"id","name");form("Fabric / Raw Material Purchase","addPurchase",[select("supplier","Supplier",opts,1),field("date","Date","date",today(),1),field("invoice","Challan / Invoice No."),field("material","Material / Fabric","text","",1),field("type","Material Type"),field("color","Color"),field("gsm","GSM"),field("width","Width"),field("qty","Quantity","number","0",1),field("unit","Unit (yard/kg/meter/pcs)"),field("rate","Purchase Rate","number","0",1),field("transport","Transport","number","0"),field("loading","Loading / Unloading","number","0"),field("other","Other Cost","number","0"),field("paid","Paid","number","0"),field("method","Payment Method"),field("remarks","Remarks")]);var rows=db.purchases.slice().reverse().map(function(r){var s=db.suppliers.find(function(x){return x.id==r.supplier});var t=purchaseTotal(r);return '<tr><td>'+r.date+'</td><td>'+esc(s?s.name:"")+'</td><td>'+esc(r.material)+'</td><td>'+r.qty+' '+esc(r.unit)+'</td><td>'+money(t)+'</td><td>'+money(r.paid)+'</td><td>'+money(t-num(r.paid))+'</td></tr>'});document.getElementById("app").insertAdjacentHTML("beforeend",'<h2>Purchase Register</h2>'+table(["Date","Supplier","Material","Qty","Total","Paid","Due"],rows))}
